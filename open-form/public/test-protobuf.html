<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autocomplete Protobuf Test</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 2rem;
      color: #333;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    h1 {
      color: #667eea;
      margin-bottom: 0.5rem;
      font-size: 2rem;
    }
    .subtitle {
      color: #666;
      margin-bottom: 2rem;
    }
    .section {
      margin: 2rem 0;
      padding: 1.5rem;
      background: #f8f9fa;
      border-radius: 12px;
    }
    .section h2 {
      color: #333;
      margin-bottom: 1rem;
      font-size: 1.25rem;
    }
    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin: 0.5rem 0.5rem 0.5rem 0;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }
    button:active {
      transform: translateY(0);
    }
    .output {
      background: #1e1e1e;
      color: #00ff00;
      padding: 1rem;
      border-radius: 8px;
      font-family: 'Courier New', monospace;
      font-size: 0.875rem;
      max-height: 400px;
      overflow-y: auto;
      margin-top: 1rem;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .status {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      font-size: 0.875rem;
      font-weight: 600;
      margin-left: 0.5rem;
    }
    .status.success { background: #d4edda; color: #155724; }
    .status.error { background: #f8d7da; color: #721c24; }
    .status.warning { background: #fff3cd; color: #856404; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1rem;
      margin-top: 1rem;
    }
    .card {
      background: white;
      padding: 1rem;
      border-radius: 8px;
      border: 2px solid #e9ecef;
    }
    .card h3 {
      color: #667eea;
      font-size: 1rem;
      margin-bottom: 0.5rem;
    }
    .card p {
      color: #666;
      font-size: 0.875rem;
    }
    input[type="text"] {
      width: 100%;
      padding: 0.75rem;
      border: 2px solid #dee2e6;
      border-radius: 8px;
      font-size: 1rem;
      margin: 0.5rem 0;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #667eea;
    }
    .results-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
    }
    .results-table th,
    .results-table td {
      padding: 0.75rem;
      text-align: left;
      border-bottom: 1px solid #dee2e6;
    }
    .results-table th {
      background: #667eea;
      color: white;
      font-weight: 600;
    }
    .badge {
      display: inline-block;
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge-prefix { background: #e8f0fe; color: #0b57d0; }
    .badge-wheeler { background: #fce8e6; color: #c5221f; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧪 Autocomplete Protobuf Test</h1>
    <p class="subtitle">Test the WASM autocomplete module with protobuf packets</p>

    <div class="section">
      <h2>1. Initialize WASM Module</h2>
      <button onclick="initializeWASM()">🚀 Initialize</button>
      <span id="initStatus" class="status warning">Not initialized</span>
    </div>

    <div class="section">
      <h2>2. Load Sample Data</h2>
      <button onclick="loadSampleData()">📦 Load Words</button>
      <button onclick="loadCustomProtobuf()">📋 Load Custom Protobuf</button>
      <span id="loadStatus" class="status warning">No data loaded</span>
      <div id="wordCount" class="card" style="margin-top: 1rem; display: none;">
        <h3>Words Loaded</h3>
        <p id="wordCountValue">0</p>
      </div>
    </div>

    <div class="section">
      <h2>3. Test Queries</h2>
      <input type="text" id="queryInput" placeholder="Type to search (e.g., 'cof', 'lun', 'gas')..." />
      <button onclick="runQuery()">🔍 Query</button>
      <button onclick="runAllTests()">▶️ Run All Tests</button>
      
      <div id="queryResults" style="margin-top: 1rem;"></div>
    </div>

    <div class="section">
      <h2>4. Protobuf Packet Inspector</h2>
      <button onclick="generatePacket()">📄 Generate Test Packet</button>
      <button onclick="printPacketDetails()">🔍 Inspect Packet</button>
      <div id="packetOutput" class="output" style="display: none;"></div>
    </div>

    <div class="section">
      <h2>Console Output</h2>
      <div id="consoleOutput" class="output">Waiting for actions...</div>
    </div>
  </div>

  <script type="module">
    import { autocompleteService } from './services/autocomplete/service.js'
    import { 
      SAMPLE_WORD_BATCH, 
      encodeWordBatchToBase64,
      generateTestPacket 
    } from './services/autocomplete/test-data.js'

    // Make functions globally available
    window.initializeWASM = async () => {
      log('🔄 Initializing WASM module...')
      try {
        await autocompleteService.initialize()
        updateStatus('initStatus', 'success', 'Initialized ✅')
        log('✅ WASM module initialized successfully')
      } catch (error) {
        updateStatus('initStatus', 'error', 'Failed ❌')
        log('❌ Initialization failed:', error)
      }
    }

    window.loadSampleData = async () => {
      log('📦 Loading sample data...')
      try {
        await autocompleteService.loadWordsJson(SAMPLE_WORD_BATCH.entries)
        const count = autocompleteService.getWordCount()
        updateStatus('loadStatus', 'success', `${count} words loaded ✅`)
        document.getElementById('wordCount').style.display = 'block'
        document.getElementById('wordCountValue').textContent = count
        log(`✅ Loaded ${count} words`)
      } catch (error) {
        updateStatus('loadStatus', 'error', 'Failed ❌')
        log('❌ Load failed:', error)
      }
    }

    window.loadCustomProtobuf = () => {
      const base64 = encodeWordBatchToBase64(SAMPLE_WORD_BATCH)
      log('📋 Custom Protobuf (base64):')
      log(base64)
      log('')
      log('Send this to WASM with:')
      log(`autocompleteService.sendProtobufPacket("${base64.substring(0, 50)}...")`)
    }

    window.runQuery = () => {
      const query = document.getElementById('queryInput').value.trim()
      if (!query) {
        log('⚠️ Please enter a query')
        return
      }
      
      log(`🔍 Querying: "${query}"`)
      const results = autocompleteService.query(query, 5)
      displayResults(results)
    }

    window.runAllTests = async () => {
      const queries = ['cof', 'lun', 'gas', 'elec', 'coffe']
      log('▶️ Running all test queries...')
      log('')
      
      for (const query of queries) {
        document.getElementById('queryInput').value = query
        log(`\n--- Query: "${query}" ---`)
        const results = autocompleteService.query(query, 5)
        displayResults(results)
      }
    }

    window.generatePacket = () => {
      log('📄 Generating test packet...')
      const packet = generateTestPacket()
      log('Packet generated!')
      log(`- Words: ${packet.batch.entries.length}`)
      log(`- Encoded size: ${packet.encoded.length} bytes`)
      log(`- Base64 size: ${packet.base64.length} bytes`)
      log('')
      log('Base64 (first 100 chars):')
      log(packet.base64.substring(0, 100) + '...')
    }

    window.printPacketDetails = () => {
      const packet = generateTestPacket()
      const output = document.getElementById('packetOutput')
      output.style.display = 'block'
      output.textContent = JSON.stringify({
        batch: packet.batch,
        encodedSize: packet.encoded.length,
        base64Size: packet.base64.length,
        compressionRatio: (1 - packet.encoded.length / JSON.stringify(packet.batch).length * 100).toFixed(1) + '%'
      }, null, 2)
      log('📋 Packet details displayed in inspector above')
    }

    // Helper functions
    function log(...args) {
      const output = document.getElementById('consoleOutput')
      const timestamp = new Date().toLocaleTimeString()
      const message = args.map(arg => 
        typeof arg === 'object' ? JSON.stringify(arg, null, 2) : arg
      ).join(' ')
      output.textContent += `[${timestamp}] ${message}\n`
      output.scrollTop = output.scrollHeight
    }

    function updateStatus(id, type, text) {
      const el = document.getElementById(id)
      el.className = `status ${type}`
      el.textContent = text
    }

    function displayResults(results) {
      const container = document.getElementById('queryResults')
      if (!results || results.length === 0) {
        container.innerHTML = '<p style="color: #666; margin-top: 1rem;">No results found</p>'
        return
      }

      const html = `
        <table class="results-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Term</th>
              <th>Score</th>
              <th>Type</th>
            </tr>
          </thead>
          <tbody>
            ${results.map((r, i) => `
              <tr>
                <td>${i + 1}</td>
                <td>${r.term}</td>
                <td>${r.score}</td>
                <td>
                  ${r.isPrefixMatch ? '<span class="badge badge-prefix">Prefix</span>' : ''}
                  ${r.isWheelerMatch ? '<span class="badge badge-wheeler">Match</span>' : ''}
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `
      container.innerHTML = html
    }

    // Auto-initialize on load
    log('👋 Autocomplete Test Page Loaded')
    log('Click "Initialize" to start testing')
  </script>
</body>
</html>
