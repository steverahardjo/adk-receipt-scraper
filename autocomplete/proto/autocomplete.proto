syntax = "proto3";

package autocomplete;

// A single word/term entry with optional metadata
message WordEntry {
    string term = 1;
    uint32 frequency = 2;
    repeated string tags = 3;
}

// Batch of word entries to be added to the trie
message WordBatch {
    repeated WordEntry entries = 1;
}

// Autocomplete request with query and options
message AutocompleteRequest {
    string query = 1;
    uint32 max_results = 2;
    bool use_wheeler = 3;  // Enable Wheeler transform for fuzzy matching
    uint32 wheeler_max_distance = 4;  // Max edit distance for Wheeler matching
}

// Single autocomplete result
message AutocompleteResult {
    string term = 1;
    uint32 score = 2;
    bool is_prefix_match = 3;
    bool is_wheeler_match = 4;
}

// Autocomplete response containing multiple results
message AutocompleteResponse {
    repeated AutocompleteResult results = 1;
    uint32 prefix_matches = 2;
    uint32 wheeler_matches = 3;
}

// Request to build/rebuild the trie
message BuildTrieRequest {
    WordBatch batch = 1;
}

// Status response
message StatusResponse {
    bool success = 1;
    string message = 2;
    uint32 word_count = 3;
}
